name: CI

on:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly: re-run on the *latest* phacc so a new Home Assistant release
    # that breaks the integration is caught proactively, not by a user.
    - cron: "0 5 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # dorny/test-reporter: publish the check run
    strategy:
      fail-fast: false
      matrix:
        # Each Python maps to a different pinned Home Assistant (via the
        # phacc pin in the install step) so version-specific behaviour
        # (e.g. OptionsFlow/config_entry changes) is exercised. Check names
        # stay "test (3.x)" so branch-protection required checks are stable.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: Install phacc (Home Assistant version per Python)
        run: |
          case "${{ matrix.python-version }}" in
            3.12) PHACC="==0.13.205" ;;   # HA 2025.1  (floor; last 3.12 build)
            3.13) PHACC="==0.13.316" ;;   # HA ~2026.3 (last 3.13 build)
            *)    PHACC="" ;;             # latest = newest HA (3.14+)
          esac
          pip install "pytest-homeassistant-custom-component${PHACC}" ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --junitxml=test-results.xml
      - name: Test Report-${{ matrix.python-version }}
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Report-${{ matrix.python-version }}
          path: test-results.xml
          reporter: java-junit
